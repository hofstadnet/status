# Dependabot holder de SHA-låste Actions i arbeidsflytene oppdatert, også upptime/uptime-monitor.
# Upptime sin egen «Update Template» er fjernet (se README), så dette er måten Upptime oppdateres på.
# cooldown: nye versjoner foreslås først etter 7 dager, så en kompromittert release rekker å bli oppdaget.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
