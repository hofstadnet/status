# Bygger og publiserer statussiden (status.hofstad.net) én gang i døgnet og når assets/ endres. Statusen på siden
# hentes uansett i sanntid fra GitHub; dette bygger rammen og historikken.
# Upptime-workflow, skrevet om for HofstadNET (README «Workflowene»): låste versjoner og bare de rettighetene jobben
# trenger.

name: Static Site CI

on:
  push:
    branches: [main]
    paths: ["assets/**"]
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upptime
  cancel-in-progress: false

jobs:
  site:
    name: Statussiden
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # committe resultatene
      issues: write # lage og lukke saker
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Token fra GitHub-appen, hvis den er satt opp
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}

      - name: Fjern appnøkkelen fra miljøet
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"

      # Upptime committer resultatene til main selv, så legitimasjonen må bli liggende i checkouten.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Bygg statussiden
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "site"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: "{}"

      - name: Publiser statussiden (branchen gh-pages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          publish_dir: site/status-page/__sapper__/export/
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
