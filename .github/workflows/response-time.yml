# Oppdaterer svartidene én gang i døgnet.
# Upptime-workflow, skrevet om for HofstadNET (README «Workflowene»): låste versjoner og bare de rettighetene jobben
# trenger.

name: Response Time CI

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upptime
  cancel-in-progress: false

jobs:
  response-time:
    name: Svartider
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # committe resultatene
      issues: write # lage og lukke saker
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Token fra GitHub-appen, hvis den er satt opp
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}

      - name: Fjern appnøkkelen fra miljøet
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"

      # Upptime committer resultatene til main selv, så legitimasjonen må bli liggende i checkouten.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Oppdater svartider
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: "{}"
