# Oppetid og statusside for hofstad.net. Upptime sjekker adressene hvert 5. minutt med GitHub Actions,
# åpner en issue når noe er nede og lukker den når det er oppe igjen. Statussiden publiseres til gh-pages
# og vises på https://status.hofstad.net. Dokumentasjon: https://upptime.js.org/docs/configuration
owner: hofstadnet
repo: status

sites:
  - name: hofstad.net
    url: https://hofstad.net/
  - name: Flystatus (API)
    url: https://hofstad.net/api/status
  - name: Søk
    url: https://hofstad.net/pagefind/pagefind.js
  - name: RSS
    url: https://hofstad.net/rss.xml
  - name: hofstad.net (engelsk)
    url: https://hofstad.net/en/
  - name: RSS (engelsk)
    url: https://hofstad.net/en/rss.xml

status-website:
  cname: status.hofstad.net
  logoUrl: https://hofstad.net/favicon.svg
  favicon: https://hofstad.net/favicon.svg
  name: Hofstad.NET-status
  introTitle: "Status for **hofstad.net**"
  introMessage: "Oppetid og svartider for siden, sjekket hvert 5. minutt fra GitHub Actions. Kildekoden ligger på [GitHub](https://github.com/hofstadnet/status)."
  navbar:
    - title: Status
      href: /
    - title: hofstad.net
      href: https://hofstad.net/
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

i18n:
  activeIncidents: Pågående hendelser
  allSystemsOperational: Alt virker som det skal
  incidentReport: "Hendelse #$NUMBER →"
  activeIncidentSummary: Åpnet $DATE med $POSTS innlegg
  anIncidentReport: Hendelsesrapport
  pastIncidents: Tidligere hendelser
  pastIncidentsResolved: Løst på $MINUTES minutter med $POSTS innlegg
  liveStatus: Status nå
  online: Oppe
  degraded: Treg
  down: Nede
  overallUptime: "Oppetid totalt: $UPTIME"
  averageResponseTime: "Gjennomsnittlig svartid: $TIMEms"
  ms: ms
  loading: Laster
  navGitHub: GitHub
  footer: Statussiden er laget med [Upptime](https://upptime.js.org).
  rateLimitExceededTitle: For mange forespørsler
  rateLimitExceededIntro: Du har nådd grensen for forespørsler mot GitHub. Prøv igjen om litt.
  rateLimitExceededWhatDoesErrorMean: Hva betyr dette?
  rateLimitExceededErrorMeaning: Statussiden henter data fra GitHub, som begrenser antall forespørsler.
  rateLimitExceededErrorHowCanFix: Hvordan løser jeg det?
  rateLimitExceededErrorFix: Vent en stund og last siden på nytt.
  errorTitle: Noe gikk galt
  errorIntro: Statusen kunne ikke hentes.
  errorText: Prøv igjen om litt.
  errorHome: Til statussiden
  pastScheduledMaintenance: Tidligere planlagt vedlikehold
  scheduledMaintenance: Planlagt vedlikehold
  scheduledMaintenanceSummaryStarted: Startet $DATE, varer $DURATION minutter
  scheduledMaintenanceSummaryStarts: Starter $DATE, varer $DURATION minutter
  startedAt: Startet
  startsAt: Starter
  duration: Varighet
  durationMin: $DURATION minutter
  incidentCompleted: Fullført
